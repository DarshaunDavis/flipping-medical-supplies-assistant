name: Android CI

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Check secret
        shell: bash
        run: |
          if [ -z "$GOOGLE_SERVICES_JSON" ]; then
            echo "❌ GOOGLE_SERVICES_JSON is empty!"
            exit 1
          fi
          echo "✅ Secret is present (${#GOOGLE_SERVICES_JSON} bytes)"
        env:
          GOOGLE_SERVICES_JSON: ${{ secrets.GOOGLE_SERVICES_JSON }}

      - name: Write google-services.json
        shell: bash
        run: |
          mkdir -p app
          echo "$GOOGLE_SERVICES_JSON" > app/google-services.json

      - name: List app/ directory
        shell: bash
        run: |
          echo "Contents of app/:"
          ls -la app/

      - name: Peek at JSON
        shell: bash
        run: |
          echo "Head of app/google-services.json:"
          head -n3 app/google-services.json || echo "❌ Not found"

      - name: Set up JDK 11
        uses: actions/setup-java@v3
        with:
          distribution: temurin
          java-version: '11'

      - name: Make Gradle wrapper executable
        shell: bash
        run: chmod +x ./gradlew

      - name: Build with Gradle
        shell: bash
        run: ./gradlew assembleDebug --stacktrace --no-daemon
