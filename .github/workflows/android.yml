name: Android CI

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      # 1) Checkout your code
      - name: Checkout code
        uses: actions/checkout@v4

      # 2) Early exit if SECRET is missing
      - name: Check GOOGLE_SERVICES_JSON secret
        run: |
          if [ -z "$GOOGLE_SERVICES_JSON" ]; then
            echo "❌ GOOGLE_SERVICES_JSON is empty!"
            exit 1
          fi
          echo "✅ Secret is present (length ${#GOOGLE_SERVICES_JSON} bytes)"
        env:
          GOOGLE_SERVICES_JSON: ${{ secrets.GOOGLE_SERVICES_JSON }}

      # 3) Write out the JSON into the expected path
      - name: Write Firebase config
        run: |
          mkdir -p app
          echo "$GOOGLE_SERVICES_JSON" > app/google-services.json

      # 4) Debug: list files in app/
      - name: Debug: list app/ directory
        run: |
          echo "--- app/ contents ---"
          ls -l app/

      # 5) Debug: show first 3 lines of the JSON
      - name: Debug: head of google-services.json
        run: |
          echo "--- head of app/google-services.json ---"
          head -n 3 app/google-services.json || echo "❌ File not found"

      # 6) Set up Java
      - name: Set up JDK 11
        uses: actions/setup-java@v3
        with:
          distribution: temurin
          java-version: '11'

      # 7) Make Gradle wrapper executable
      - name: Make Gradle executable
        run: chmod +x ./gradlew

      # 8) Build
      - name: Build with Gradle
        run: ./gradlew assembleDebug --stacktrace --no-daemon
