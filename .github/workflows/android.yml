jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v3

      - name: Check Firebase secret
        run: |
          if [ -z "$GOOGLE_SERVICES_JSON" ]; then
            echo "❌ Secret is empty!"
            exit 1
          else
            echo "✅ Secret loaded (${#GOOGLE_SERVICES_JSON} bytes)"
          fi
        env:
          GOOGLE_SERVICES_JSON: ${{ secrets.GOOGLE_SERVICES_JSON }}

      - name: Write Firebase config
        run: |
          # this heredoc ends here—no stray lines!
          echo "$GOOGLE_SERVICES_JSON" > app/google-services.json

      - name: Debug: list app/
        run: |
          echo "Contents of app/:"
          ls -l app/

      - name: Debug: head of JSON
        run: head -n1 app/google-services.json || echo "❌ Not found"

      - name: Set up JDK
        uses: actions/setup-java@v3
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Make Gradle executable
        run: chmod +x ./gradlew

      - name: Build with Gradle
        run: ./gradlew build --stacktrace --no-daemon
