name: Android CI

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Check and write Firebase config
        shell: bash
        run: |
          if [ -z "$GOOGLE_SERVICES_JSON" ]; then
            echo "❌ GOOGLE_SERVICES_JSON is empty!"
            exit 1
          fi
          echo "✅ Secret loaded (${#GOOGLE_SERVICES_JSON} bytes)"

          # Ensure all possible lookup directories exist
          mkdir -p app
          mkdir -p app/src
          mkdir -p app/src/debug
          mkdir -p app/src/main

          # Write the file in each location
          echo "$GOOGLE_SERVICES_JSON" > app/google-services.json
          echo "$GOOGLE_SERVICES_JSON" > app/src/google-services.json
          echo "$GOOGLE_SERVICES_JSON" > app/src/debug/google-services.json
          echo "$GOOGLE_SERVICES_JSON" > app/src/main/google-services.json

          - name: Debug: list app/ tree
            shell: bash
            run: |
          echo "---- app/ tree ----"
          find app -maxdepth 3 -type f | sed 's/^/ /'

      - name: Set up JDK 11
        uses: actions/setup-java@v3
        with:
          distribution: temurin
          java-version: '11'

      - name: Make Gradle wrapper executable
        shell: bash
        run: chmod +x ./gradlew

      - name: Build with Gradle
        shell: bash
        run: ./gradlew assembleDebug --stacktrace --no-daemon
