name: Android CI
on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Write firebase config
        run: |
          mkdir -p app src/debug src/main
          echo "$GOOGLE_SERVICES_JSON" > app/google-services.json
          echo "$GOOGLE_SERVICES_JSON" > src/google-services.json
        shell: bash
        env:
          GOOGLE_SERVICES_JSON: ${{ secrets.GOOGLE_SERVICES_JSON }}

      - name: Debug listing
        run: |
          echo "app/:"
          ls -1 app
          echo "src/:"
          ls -1 src
        shell: bash

      - name: Build
        run: ./gradlew assembleDebug --stacktrace --no-daemon
        shell: bash
